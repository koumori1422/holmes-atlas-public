<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホームズ・アトラス／JSHC版（開発中）</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Crimson+Pro:wght@400;500;600&display=swap">
<style>

:root{
  --ink:#1c2430; --ink-2:#232d3c;
  --parchment:#ece3cc; --parchment-2:#e0d4b3;
  --brass:#ab8347; --brass-light:#c9a562;
  --burgundy:#7a2634; --teal:#2f5d5a; --slate:#55606e; --pastiche:#7c5980;
  --charcoal:#2b2620; --fog:#cdd5db; --line:rgba(171,131,71,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--ink);font-family:'Crimson Pro',serif;color:var(--fog);}
button,input,select,textarea{font-family:'Crimson Pro',serif;}

.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:56px 1fr;height:100vh;}
.header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--ink-2);border-bottom:1px solid var(--line);}
.seal{width:24px;height:24px;flex:none;}
.header h1{font-family:'Playfair Display',serif;font-weight:600;font-style:italic;font-size:1.05rem;color:var(--parchment);margin:0;}
.header .sub{font-size:.76rem;color:var(--brass-light);opacity:.85;}
.header-spacer{flex:1;}
.hbtn{background:none;border:1px solid var(--line);color:var(--fog);font-size:.82rem;padding:6px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;}
.auth-area{display:inline-flex;align-items:center;gap:8px;margin-left:6px;}
.auth-name{color:var(--brass-light);font-size:.82rem;white-space:nowrap;}
.link-btn{background:none;border:none;color:var(--brass);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit;}
.google-auth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;border:1px solid var(--line);color:#3c3c3c;padding:9px;border-radius:4px;cursor:pointer;font-size:.88rem;margin-top:8px;}
.google-auth-btn:hover{background:#f5f5f5;}
.auth-divider{text-align:center;font-size:.75rem;color:var(--slate);margin:14px 0;position:relative;}
.auth-divider::before,.auth-divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--line);}
.auth-divider::before{left:0;} .auth-divider::after{right:0;}
.hbtn:hover{border-color:var(--brass);color:#fff;}
.hbtn.primary{background:var(--brass);border-color:var(--brass);color:#fff;}
.hbtn.primary:hover{background:var(--brass-light);}
.index-toggle{display:none;}
.action-btns{display:flex;gap:10px;flex-wrap:wrap;}
.menu-toggle{display:none;}

.index{background:var(--ink-2);border-right:1px solid var(--line);overflow-y:auto;padding:14px 0 20px;}
.index-group-header{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:none;font-weight:600;font-size:.78rem;color:var(--brass-light);padding:9px 16px;margin:0;border-bottom:1px solid var(--line);border-top:1px solid var(--line);cursor:pointer;}
.index-group-header:hover{background:rgba(171,131,71,.1);}
.igh-arrow{font-size:.7rem;width:10px;}
.igh-count{margin-left:auto;font-size:.7rem;opacity:.6;font-weight:400;}
.index-group-items{padding-bottom:4px;}
.index-item{display:block;width:100%;text-align:left;background:none;border:none;color:var(--fog);font-size:.9rem;padding:7px 16px;cursor:pointer;}
.index-link-item{text-decoration:none;box-sizing:border-box;}
.index-link-desc{display:block;font-size:.72rem;opacity:.6;margin-top:2px;}
.alias-list-item{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 16px;font-size:.82rem;color:var(--fog);}
.alias-list-empty{padding:8px 16px;font-size:.78rem;opacity:.55;font-style:italic;}
.site-license{padding:16px;font-size:.68rem;color:var(--fog);opacity:.6;line-height:1.7;border-top:1px solid var(--line);margin-top:10px;}
.site-license a{color:var(--brass-light);}
.fav-subheader{padding:8px 16px 4px;font-size:.7rem;color:var(--brass-light);font-weight:600;}
.alias-add-standalone-btn{display:block;width:calc(100% - 24px);margin:4px 12px 8px;font-size:.78rem;background:var(--teal);border:none;color:#fff;padding:6px 0;border-radius:3px;cursor:pointer;}
.alias-delete-btn{background:none;border:1px solid var(--line);color:var(--fog);width:20px;height:20px;border-radius:50%;cursor:pointer;font-size:.78rem;flex:none;line-height:1;padding:0;}
.alias-delete-btn:hover{border-color:var(--burgundy);color:var(--burgundy);}
.index-item:hover{background:rgba(171,131,71,.12);}
.index-item.active{background:rgba(171,131,71,.22);color:#fff;}

.stage{position:relative;overflow:hidden;height:100%;}
#map{position:absolute;inset:0;width:100%;height:100%;background:#dfe6ea;filter:sepia(.18) saturate(.85) brightness(.97) contrast(1.02);}
.map-status{position:absolute;top:12px;left:12px;z-index:500;background:var(--ink-2);color:var(--fog);border:1px solid var(--line);padding:6px 12px;border-radius:3px;font-size:.8rem;display:none;}
.map-status.show{display:block;}
.map-search{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:600;width:min(380px,82%);}
.stage:has(.panel.open) .map-search,
.stage:has(.panel.open) .locate-map-btn,
.stage:has(.panel.open) .historic-toggle-btn{display:none;}
.map-search-row{display:flex;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.25);border-radius:3px;}
.map-search-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:3px 0 0 3px;font-size:.9rem;background:#fff;color:var(--charcoal);}
.map-search-row button{background:var(--brass);border:none;color:#fff;padding:0 16px;border-radius:0;cursor:pointer;font-size:.85rem;}
.map-search-row button:last-child{border-radius:0 3px 3px 0;}
.map-search-clear-btn{background:#fff!important;color:var(--slate)!important;border-left:1px solid var(--line)!important;width:32px;padding:0!important;font-size:1.1rem!important;}
.map-search-clear-btn:hover{color:var(--burgundy)!important;}
.map-search-results{margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;display:none;max-height:300px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.map-search-results.show{display:block;}
.map-search-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);padding:9px 12px;font-size:.86rem;color:var(--charcoal);cursor:pointer;}
.map-search-item:hover{background:#f7ecd0;}
.map-search-item .msi-sub{font-size:.72rem;opacity:.6;margin-left:auto;padding-left:8px;}
.map-search-section{padding:6px 12px;font-size:.7rem;color:var(--slate);background:var(--parchment-2);}
.alias-register-row{display:flex;gap:6px;padding:8px 12px;background:#fff;}
.alias-register-row input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:3px;font-size:.8rem;}
.alias-register-row button{background:var(--brass);border:none;color:#fff;padding:0 12px;border-radius:3px;cursor:pointer;font-size:.8rem;white-space:nowrap;}
.search-popup-btn{background:var(--brass);border:none;color:#fff;padding:5px 10px;border-radius:3px;cursor:pointer;font-size:.8rem;margin-top:4px;}
.locate-map-btn{position:absolute;bottom:16px;right:16px;z-index:500;width:42px;height:42px;border-radius:50%;background:var(--ink-2);border:1px solid var(--line);color:var(--fog);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.locate-map-btn:hover{border-color:var(--brass);}
.locate-map-btn svg{width:20px;height:20px;}
.historic-toggle-btn{position:absolute;bottom:16px;right:66px;z-index:500;height:42px;padding:0 14px;border-radius:21px;background:var(--ink-2);border:1px solid var(--line);color:var(--fog);cursor:pointer;font-size:.82rem;box-shadow:0 2px 8px rgba(0,0,0,.35);white-space:nowrap;}
.historic-toggle-btn:hover{border-color:var(--brass);}
.historic-toggle-btn.active{background:var(--brass);color:#fff;border-color:var(--brass);}
.nearby-panel{position:absolute;bottom:66px;right:16px;z-index:500;width:min(300px,80%);background:var(--parchment);border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.3);max-height:320px;overflow-y:auto;display:none;}
.nearby-panel.show{display:block;}
.nearby-panel-head{padding:10px 14px;font-size:.82rem;font-weight:600;color:var(--ink);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.nearby-panel-close{background:none;border:none;cursor:pointer;font-size:1rem;color:var(--charcoal);opacity:.6;}
.nearby-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);padding:9px 14px;font-size:.85rem;color:var(--charcoal);cursor:pointer;}
.nearby-item:hover{background:#f7ecd0;}
.nearby-item .ni-dist{font-size:.72rem;opacity:.6;white-space:nowrap;margin-left:8px;}
.leaflet-holmes-icon{background:var(--brass);border:2px solid var(--parchment);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.holmes-cluster-icon{background:transparent;}
.cluster-icon-inner{width:34px;height:34px;border-radius:50%;background:var(--brass);border:2px solid var(--parchment);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Crimson Pro',serif;font-weight:700;font-size:.92rem;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.leaflet-holmes-icon svg{width:14px;height:14px;}
.leaflet-holmes-icon-peripheral{background:var(--slate);opacity:.8;border:1.5px solid var(--parchment);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4);}
.leaflet-holmes-icon-peripheral svg{width:9px;height:9px;}
.leaflet-holmes-special-icon{background:var(--burgundy);border:3px solid var(--brass-light);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(171,131,71,.35),0 2px 8px rgba(0,0,0,.6);}
.leaflet-holmes-special-icon svg{width:19px;height:19px;}
.place-label-special{background:var(--burgundy)!important;color:#fff!important;border:2px solid var(--brass-light)!important;font-family:'Crimson Pro',serif;font-weight:700!important;font-size:.82rem!important;padding:4px 10px!important;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.5)!important;pointer-events:none!important;}
.place-label-special::before{border-top-color:var(--burgundy)!important;}
.leaflet-journal-icon{background:var(--teal);border:2px solid var(--parchment);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.leaflet-journal-icon svg{width:13px;height:13px;}
.place-label{background:rgba(28,36,48,.88)!important;color:var(--parchment)!important;border:1px solid var(--brass)!important;font-family:'Crimson Pro',serif;font-size:.72rem!important;padding:2px 7px!important;border-radius:2px;box-shadow:none!important;pointer-events:none!important;}
.place-label::before{border-top-color:rgba(28,36,48,.88)!important;}
.hide-place-labels .place-label{display:none;}
.hide-place-labels .place-label.force-show{display:block!important;}
.leaflet-tooltip.force-show{z-index:650!important;}
.leaflet-tooltip.spiderfied-hide{display:none!important;}
.map-area-label{background:none!important;border:none!important;box-shadow:none!important;padding:0!important;color:#3a2e1e!important;font-family:'Playfair Display',serif;font-weight:600;font-size:.82rem;letter-spacing:.03em;text-shadow:-1px -1px 0 #ece3cc,1px -1px 0 #ece3cc,-1px 1px 0 #ece3cc,1px 1px 0 #ece3cc,0 0 6px #ece3cc;pointer-events:none!important;}
.map-area-label::before{display:none!important;}

.panel{position:absolute;top:0;right:0;bottom:0;width:min(640px,92%);background:var(--parchment);color:var(--charcoal);transform:translateX(100%);transition:transform .28s ease;overflow-y:auto;border-left:3px solid var(--brass);box-shadow:-6px 0 18px rgba(0,0,0,.35);}
.panel.open{transform:translateX(0);}
.trail{display:flex;flex-wrap:wrap;gap:4px;padding:14px 20px 0;font-size:.78rem;}
.trail button{background:none;border:none;color:var(--slate);cursor:pointer;padding:2px 0;font-size:.78rem;text-decoration:underline;text-decoration-color:var(--line);}
.trail span.sep{color:var(--brass);padding:0 2px;}
.panel-close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.3rem;color:var(--charcoal);cursor:pointer;opacity:.55;}
.panel-close:hover{opacity:1;}
.panel-body{padding:6px 24px 30px;}
.type-badge{display:inline-block;font-size:.7rem;padding:2px 9px;border-radius:2px;color:#fff;margin-bottom:10px;}
.fav-toggle-btn{float:right;background:none;border:1px solid var(--line);color:var(--slate);font-size:.8rem;padding:3px 10px;border-radius:12px;cursor:pointer;margin-bottom:10px;}
.fav-toggle-btn.active{background:var(--brass);border-color:var(--brass);color:#fff;}
.fav-toggle-btn:hover{border-color:var(--brass);}
.badge-place{background:var(--brass);} .badge-person{background:var(--burgundy);}
.badge-work{background:var(--teal);} .badge-term{background:var(--slate);}
.badge-pastiche{background:var(--pastiche);}
.badge-peripheral{background:none;border:1px solid var(--slate);color:var(--slate)!important;}
.panel-body h3{font-family:'Playfair Display',serif;font-weight:600;font-size:1.4rem;margin:2px 0 12px;color:var(--ink);}
.panel-body img.entity-img{width:100%;border-radius:3px;margin-bottom:14px;border:1px solid var(--line);}
.photo-row{display:flex;gap:10px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.photo-row .photo-block{flex:0 0 150px;position:relative;}
.photo-block{flex:1;min-width:140px;}
.photo-del-btn{position:absolute;top:4px;right:4px;z-index:5;width:20px;height:20px;border-radius:50%;background:rgba(28,36,48,.75);color:#fff;border:none;cursor:pointer;font-size:.85rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
.photo-del-btn:hover{background:var(--burgundy);}
.add-photo-btn{flex:0 0 80px;height:150px;border:1px dashed var(--line);border-radius:3px;background:none;color:var(--slate);cursor:pointer;font-size:.72rem;line-height:1.4;}
.add-photo-btn:hover{border-color:var(--brass);color:var(--brass);}
.photo-block img{width:100%;height:150px;object-fit:cover;border-radius:3px;border:1px solid var(--line);display:block;}
.photo-block .photo-label{font-size:.72rem;font-weight:600;color:var(--slate);margin-bottom:3px;}
.photo-credit{font-size:.68rem;color:var(--slate);line-height:1.4;margin-top:3px;}
.photo-credit a{color:var(--slate);}
.panel-body p{font-size:.96rem;line-height:1.75;margin:0 0 18px;}
.desc-toggle-btn{background:none;border:none;color:var(--brass);font-size:.8rem;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:var(--line);margin:-14px 0 18px;display:block;}
.entity-desc.collapsed{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.desc-link{background:none;border:none;padding:0;font:inherit;color:var(--brass);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);}
.desc-link:hover{color:var(--burgundy);}
.desc-link-ambiguous{background:none;border:none;padding:0;font:inherit;color:var(--slate);cursor:pointer;text-decoration:underline;text-decoration-style:dashed;text-decoration-color:var(--brass);}
.desc-link-ambiguous:hover{color:var(--burgundy);}
.related h4{font-weight:600;font-size:.83rem;color:var(--slate);margin:0 0 8px;border-top:1px solid var(--line);padding-top:14px;}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.chip-wrap{display:inline-flex;align-items:center;gap:3px;}
.chip{font-size:.86rem;background:var(--parchment-2);border:1px solid var(--line);color:var(--charcoal);padding:5px 11px;border-radius:3px;cursor:pointer;}
.chip:hover{border-color:var(--brass);background:#f1e8cc;}
.chip-map-btn{width:26px;height:26px;flex:none;border-radius:50%;background:var(--brass);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.chip-map-btn svg{width:14px;height:14px;}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.dot-place{background:var(--brass);} .dot-person{background:var(--burgundy);}
.dot-work{background:var(--teal);} .dot-term{background:var(--slate);}
.dot-pastiche{background:var(--pastiche);}
.edit-btn{font-size:.85rem;background:none;border:1px solid var(--brass);color:var(--brass);padding:6px 13px;border-radius:3px;cursor:pointer;margin-right:8px;}
.edit-btn:hover{background:var(--brass);color:#fff;}
.map-jump-main-btn{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;background:none;border:1px solid var(--brass);color:var(--brass);padding:6px 13px;border-radius:3px;cursor:pointer;margin-bottom:14px;margin-right:8px;text-decoration:none;}
.map-jump-main-btn:hover{background:var(--brass);color:#fff;}
.map-jump-main-btn svg{width:14px;height:14px;}

.note-section{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;}
.note-locked{font-size:.85rem;color:var(--slate);}
.note-section h4{font-weight:600;font-size:.83rem;color:var(--slate);margin:0 0 10px;}
.stars{display:flex;gap:4px;margin-bottom:10px;}
.star-btn{background:none;border:none;font-size:1.3rem;line-height:1;cursor:pointer;color:var(--line);padding:0;}
.star-btn.filled{color:var(--brass);}
.note-field{margin-bottom:10px;}
.note-field label{display:block;font-size:.78rem;color:var(--slate);margin-bottom:3px;}
.note-field input[type=text],.note-field input[type=date],.note-field textarea{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:3px;font-size:.88rem;background:#fff;}
.note-field textarea{min-height:70px;resize:vertical;}
.note-save-btn{background:var(--teal);border:none;color:#fff;padding:7px 16px;border-radius:3px;cursor:pointer;font-size:.85rem;}

.journal-section{border-top:1px solid var(--line);margin-top:18px;padding-top:14px;}
.journal-section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.journal-section-head h4{font-weight:600;font-size:.83rem;color:var(--slate);margin:0;}
.add-journal-btn{font-size:.78rem;background:var(--teal);border:none;color:#fff;padding:5px 11px;border-radius:3px;cursor:pointer;}
.journal-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:10px;}
.journal-card img{width:100%;max-height:160px;object-fit:cover;border-radius:3px;margin-bottom:8px;display:block;}
.journal-card .jc-place{font-weight:600;font-size:.9rem;color:var(--ink);margin-bottom:3px;}
.journal-card .jc-comment{font-size:.88rem;line-height:1.6;margin:0 0 6px;white-space:pre-wrap;}
.journal-card .jc-meta{font-size:.74rem;color:var(--slate);}
.journal-card .jc-actions{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
.jc-delete-btn{background:none;border:1px solid var(--burgundy);color:var(--burgundy);padding:3px 10px;border-radius:3px;font-size:.72rem;cursor:pointer;}
.jc-like-btn,.jc-reply-toggle-btn,.jc-report-btn{background:none;border:1px solid var(--line);color:var(--slate);padding:3px 10px;border-radius:3px;font-size:.72rem;cursor:pointer;}
.jc-like-btn.liked{border-color:var(--burgundy);color:var(--burgundy);}
.jc-report-btn:hover{border-color:var(--burgundy);color:var(--burgundy);}
.jc-replies{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);}
.jc-reply{font-size:.82rem;line-height:1.6;margin-bottom:6px;}
.jc-reply-form{display:flex;gap:6px;margin-top:6px;}
.jc-reply-form input{flex:1;padding:5px 8px;border:1px solid var(--line);border-radius:3px;font-size:.82rem;}
.jc-reply-form button{background:var(--brass);border:none;color:#fff;padding:0 12px;border-radius:3px;cursor:pointer;font-size:.8rem;}
.review-section-label{font-weight:600;color:var(--brass-light);margin:16px 0 4px;font-size:.85rem;}
.empty-msg{font-size:.88rem;opacity:.6;font-style:italic;}

.modal-overlay{position:fixed;inset:0;background:rgba(28,36,48,.65);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--parchment);color:var(--charcoal);border-radius:5px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px 26px;border-top:4px solid var(--brass);}
.modal h3{font-family:'Playfair Display',serif;margin:0 0 4px;font-size:1.25rem;color:var(--ink);}
.modal .modal-sub{font-size:.82rem;opacity:.7;margin-bottom:16px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--slate);margin-bottom:4px;}
.field input[type=text],.field input[type=date],.field textarea,.field select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:3px;font-size:.9rem;background:#fff;}
.field textarea{min-height:90px;resize:vertical;}
.field .hint{font-size:.74rem;opacity:.6;margin-top:3px;}
.geo-row{display:flex;gap:6px;}
.geo-row input{flex:1;}
.geo-search-btn{background:var(--slate);border:none;color:#fff;padding:0 14px;border-radius:3px;cursor:pointer;font-size:.85rem;white-space:nowrap;}
.geo-results{margin-top:6px;max-height:130px;overflow-y:auto;}
.geo-result-item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:3px;padding:6px 9px;margin-bottom:5px;font-size:.82rem;cursor:pointer;}
.geo-result-item:hover{border-color:var(--brass);background:#f7ecd0;}
.geo-result-item.selected{border-color:var(--teal);background:#e7f0ef;}
.latlng-row{display:flex;gap:8px;margin-top:8px;}
.latlng-row input{width:100%;}
.checklist{max-height:140px;overflow-y:auto;border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:#fff;}
.checklist label{display:block;font-size:.85rem;font-weight:400;margin:3px 0;cursor:pointer;}
.file-input{width:100%;font-size:.85rem;padding:6px 0;}
.image-preview{margin-top:8px;}
.image-preview img{max-width:100%;max-height:160px;border-radius:3px;border:1px solid var(--line);display:block;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
.modal-cancel{background:none;border:1px solid var(--line);color:var(--charcoal);padding:7px 16px;border-radius:3px;cursor:pointer;}
.modal-submit{background:var(--brass);border:none;color:#fff;padding:7px 18px;border-radius:3px;cursor:pointer;}
.danger-zone{margin-top:22px;padding-top:14px;border-top:1px dashed var(--burgundy);text-align:right;}
.review-count-badge{background:var(--burgundy);color:#fff;border-radius:10px;padding:1px 7px;font-size:.72rem;margin-left:4px;}
.review-list{max-height:420px;overflow-y:auto;margin:14px 0;}
.proposal-card{background:var(--parchment-2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px;color:var(--charcoal);}
.proposal-head{font-size:.95rem;margin-bottom:2px;}
.proposal-kind{display:inline-block;background:var(--teal);color:#fff;font-size:.68rem;padding:1px 8px;border-radius:2px;margin-right:6px;}
.proposal-meta{font-size:.72rem;opacity:.65;margin-bottom:8px;}
.proposal-detail{font-size:.85rem;line-height:1.6;margin-bottom:10px;}
.proposal-actions{display:flex;gap:8px;}
.danger-delete-btn{background:none;border:1px solid var(--burgundy);color:var(--burgundy);padding:6px 16px;border-radius:3px;cursor:pointer;font-size:.82rem;}
.danger-delete-btn:hover:not(:disabled){background:var(--burgundy);color:#fff;}
.danger-delete-btn:disabled{opacity:.4;cursor:not-allowed;}

.timeline{position:absolute;inset:0;background:var(--parchment);color:var(--charcoal);overflow-y:auto;display:none;padding:20px 26px 60px;}
.timeline-close{position:absolute;top:14px;right:20px;background:none;border:none;font-size:1.8rem;line-height:1;color:var(--slate);cursor:pointer;padding:4px 8px;}
.timeline-close:hover{color:var(--burgundy);}
.timeline.open{display:block;}
.timeline h2{font-family:'Playfair Display',serif;font-size:1.5rem;margin:4px 0 4px;color:var(--ink);}
.timeline-note{font-size:.85rem;opacity:.7;margin-bottom:18px;}

.mybook-stats{background:var(--parchment-2);border:1px solid var(--line);border-radius:5px;padding:16px 18px;margin-bottom:20px;}
.mybook-badge-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.mybook-badge-icon{font-size:1.9rem;line-height:1;}
.mybook-badge-label{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--ink);}
.mybook-badge-next{font-size:.76rem;opacity:.65;margin-top:2px;}
.mybook-progress-bar{background:#fff;border:1px solid var(--line);border-radius:20px;height:10px;overflow:hidden;margin:6px 0 12px;}
.mybook-progress-fill{background:var(--teal);height:100%;border-radius:20px;transition:width .4s;}
.mybook-numbers{display:flex;gap:22px;flex-wrap:wrap;font-size:.78rem;color:var(--slate);}
.mybook-numbers strong{display:block;font-size:1.35rem;color:var(--ink);font-family:'Playfair Display',serif;font-weight:600;}
.mybook-section-label{font-weight:600;color:var(--slate);margin:0 0 10px;font-size:.85rem;}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-2);color:var(--parchment);padding:10px 20px;border-radius:4px;border:1px solid var(--brass);font-size:.88rem;z-index:3000;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.lightbox-overlay{position:fixed;inset:0;background:rgba(10,13,18,.92);display:none;align-items:center;justify-content:center;z-index:5000;padding:30px;cursor:zoom-out;}
.lightbox-overlay.open{display:flex;}
.lightbox-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.lightbox-close{position:absolute;top:16px;right:20px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;line-height:1;}
.photo-block img,.entity-img,.journal-card img{cursor:zoom-in;}
.toast.show{opacity:1;}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:56px 1fr;}
  .index{position:absolute;top:56px;left:0;bottom:0;width:240px;z-index:1000;transform:translateX(-100%);transition:transform .25s ease;}
  .index.open{transform:translateX(0);}
  .index-toggle{display:inline-block;}
  .panel{width:100%;}
  .header .sub{display:none;}
  .menu-toggle{display:inline-block;}
  .action-btns{display:none;position:absolute;top:56px;right:12px;z-index:1500;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;flex-direction:column;gap:6px;padding:10px;box-shadow:0 6px 16px rgba(0,0,0,.4);min-width:200px;}
  .action-btns.open{display:flex;}
  .action-btns .hbtn{width:100%;text-align:left;}
  .modal{padding:18px 16px 22px;}
  .timeline{padding:16px 16px 50px;}
}
</style>

<script>
// ---------- Supabase設定 ----------
const SUPABASE_URL = 'https://brwuckusjxvwmixxyyow.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fE_4Utj8xPDhjUBPbw4Dpg_QGLHu74B';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ---------- 会員ログイン ----------
let currentUser = null;
// 個人メモ（★評価・訪問日・所有版・自由記述・お気に入り）は会員ごとに保存する。
// 会員本人しかキー（p-notes:<自分のuser id>）を知らないので、他の会員のメモを上書きしてしまうことはない。
let personalNotes = {}; // { entityId: {rating, visitedDate, ownedEdition, notes, favorite} }
function notesStorageKey(){
  return currentUser ? ('p-notes:' + currentUser.id) : null;
}
function getDisplayName(user){
  if(!user) return '';
  const m = user.user_metadata || {};
  return m.display_name || m.full_name || m.name || user.email;
}
// ---------- 審査担当者 ----------
let reviewerEmails = [];
async function loadReviewers(){
  try{
    const { data, error } = await supabaseClient.from('reviewers').select('email');
    if(!error && data) reviewerEmails = data.map(r=>r.email);
  }catch(e){ console.error('reviewers load failed', e); }
}
function isReviewer(){
  return !!(currentUser && reviewerEmails.includes(currentUser.email));
}
function renderAuthArea(){
  const el = document.getElementById('authArea');
  if(currentUser){
    const name = getDisplayName(currentUser);
    const reviewBtn = isReviewer() ? `<button class="hbtn primary" id="reviewDashBtn">審査ダッシュボード<span class="review-count-badge" id="reviewCountBadge"></span></button>` : '';
    el.innerHTML = `${reviewBtn}<button class="hbtn" id="myBookBtn">📔 マイ巡礼手帳</button><span class="auth-name">${escapeHtml(name)}さん</span><button class="hbtn" id="editNameBtn">名前を変更</button><button class="hbtn" id="logoutBtn">ログアウト</button>`;
    document.getElementById('logoutBtn').addEventListener('click', async ()=>{
      await supabaseClient.auth.signOut();
    });
    document.getElementById('editNameBtn').addEventListener('click', openEditNameModal);
    document.getElementById('reviewDashBtn')?.addEventListener('click', openReviewDashboard);
    document.getElementById('myBookBtn').addEventListener('click', ()=>{
      panel.classList.remove('open');
      timelineEl.classList.remove('open');
      myBookEl.classList.toggle('open');
      if(myBookEl.classList.contains('open')) renderMyBook();
    });
    updateReviewCountBadge();
  } else {
    el.innerHTML = `<button class="hbtn" id="loginBtn">ログイン</button><button class="hbtn" id="signupBtn">会員登録</button>`;
    document.getElementById('loginBtn').addEventListener('click', ()=>openAuthModal('login'));
    document.getElementById('signupBtn').addEventListener('click', ()=>openAuthModal('signup'));
  }
}
function openAuthModal(mode){
  const isSignup = mode==='signup';
  modalBody.innerHTML = `
    <h3>${isSignup ? '会員登録' : 'ログイン'}</h3>
    <div class="modal-sub">${isSignup ? 'JSHC会員の方はどなたでも登録できます。' : 'ログインすると、地名の提案・訪問レポートの投稿ができます。'}</div>
    <button class="google-auth-btn" id="auth-google">
      <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.3 29.3 35 24 35c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l6-6C34.6 4.9 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l6-6C34.6 4.9 29.6 3 24 3 16.3 3 9.6 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.5 36.1 26.9 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.5 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.6 5.4C41.6 36 44 30.5 44 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      ${isSignup ? 'Googleで会員登録' : 'Googleでログイン'}
    </button>
    <div class="auth-divider">または</div>
    ${isSignup ? `<div class="field"><label>お名前（表示名）</label><input type="text" id="auth-name" placeholder="例：ワトスン"></div>` : ''}
    <div class="field"><label>メールアドレス</label><input type="email" id="auth-email"></div>
    <div class="field"><label>パスワード</label><input type="password" id="auth-password" placeholder="8文字以上"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="auth-cancel">キャンセル</button>
      <button class="modal-submit" id="auth-submit">${isSignup ? '登録する' : 'ログイン'}</button>
    </div>
    <div class="modal-sub" style="margin-top:14px;">${isSignup ? 'すでに登録済みの方は' : 'まだ登録していない方は'} <button class="link-btn" id="auth-switch">${isSignup ? 'ログイン' : '会員登録'}へ</button></div>
    ${!isSignup ? `<div class="modal-sub" style="margin-top:6px;"><button class="link-btn" id="auth-forgot">パスワードをお忘れですか？</button></div>` : ''}`;
  overlay.classList.add('open');
  document.getElementById('auth-cancel').addEventListener('click', closeModal);
  document.getElementById('auth-switch').addEventListener('click', ()=>openAuthModal(isSignup ? 'login' : 'signup'));
  document.getElementById('auth-forgot')?.addEventListener('click', openForgotPasswordModal);
  document.getElementById('auth-google').addEventListener('click', async ()=>{
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: 'https://koumori1422.github.io/holmes-atlas-public/' }
    });
    if(error) showToast('Googleログインに失敗しました：' + error.message);
  });
  document.getElementById('auth-submit').addEventListener('click', async ()=>{
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;
    if(!email || !password){ showToast('メールアドレスとパスワードを入力してください。'); return; }
    if(isSignup){
      const name = document.getElementById('auth-name').value.trim();
      if(!name){ showToast('お名前を入力してください。'); return; }
      const { error } = await supabaseClient.auth.signUp({ email, password, options:{ data:{ display_name: name } } });
      if(error){ showToast('登録に失敗しました：' + error.message); return; }
      closeModal();
      showToast('登録しました。確認メールが届く場合は、案内に従ってください。');
    } else {
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if(error){ showToast('ログインに失敗しました：' + error.message); return; }
      closeModal();
      showToast('ログインしました。');
    }
  });
}
async function openEditNameModal(){
  modalBody.innerHTML = `
    <h3>表示名を変更</h3>
    <div class="modal-sub">投稿・いいね・返信に表示される名前です。</div>
    <div class="field"><label>新しい表示名</label><input type="text" id="editname-input" value="${escapeAttr(getDisplayName(currentUser))}"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="editname-cancel">キャンセル</button>
      <button class="modal-submit" id="editname-submit">変更する</button>
    </div>`;
  overlay.classList.add('open');
  document.getElementById('editname-cancel').addEventListener('click', closeModal);
  document.getElementById('editname-submit').addEventListener('click', async ()=>{
    const name = document.getElementById('editname-input').value.trim();
    if(!name){ showToast('表示名を入力してください。'); return; }
    const { data, error } = await supabaseClient.auth.updateUser({ data: { display_name: name } });
    if(error){ showToast('変更に失敗しました：' + error.message); return; }
    currentUser = data.user;
    closeModal();
    showToast('表示名を変更しました。');
    renderAuthArea();
  });
}
function openForgotPasswordModal(){
  modalBody.innerHTML = `
    <h3>パスワードの再設定</h3>
    <div class="modal-sub">登録したメールアドレスに、再設定用のリンクを送ります。</div>
    <div class="field"><label>メールアドレス</label><input type="email" id="forgot-email"></div>
    <div class="modal-actions">
      <button class="modal-cancel" id="forgot-cancel">キャンセル</button>
      <button class="modal-submit" id="forgot-submit">送信する</button>
    </div>`;
  overlay.classList.add('open');
  document.getElementById('forgot-cancel').addEventListener('click', closeModal);
  document.getElementById('forgot-submit').addEventListener('click', async ()=>{
    const email = document.getElementById('forgot-email').value.trim();
    if(!email){ showToast('メールアドレスを入力してください。'); return; }
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0].split('?')[0] });
    if(error){ showToast('送信に失敗しました：' + error.message); return; }
    closeModal();
    showToast('再設定用のメールを送信しました。メールをご確認ください。');
  });
}
function openSetNewPasswordModal(){
  modalBody.innerHTML = `
    <h3>新しいパスワードを設定</h3>
    <div class="modal-sub">新しいパスワードを入力してください。</div>
    <div class="field"><label>新しいパスワード</label><input type="password" id="newpass-input" placeholder="8文字以上"></div>
    <div class="modal-actions">
      <button class="modal-submit" id="newpass-submit">設定する</button>
    </div>`;
  overlay.classList.add('open');
  document.getElementById('newpass-submit').addEventListener('click', async ()=>{
    const pw = document.getElementById('newpass-input').value;
    if(!pw || pw.length < 8){ showToast('8文字以上のパスワードを入力してください。'); return; }
    const { error } = await supabaseClient.auth.updateUser({ password: pw });
    if(error){ showToast('設定に失敗しました：' + error.message); return; }
    closeModal();
    showToast('パスワードを変更しました。');
  });
}
supabaseClient.auth.onAuthStateChange(async (event, session)=>{
  if(event === 'PASSWORD_RECOVERY'){ openSetNewPasswordModal(); return; }
  currentUser = session?.user || null;
  personalNotes = (await safeGet(notesStorageKey())) || {};
  renderAuthArea();
});

  try{
    const { data, error } = await supabaseClient.from('atlas_data').select('value').eq('key', key).maybeSingle();

    if(error){ console.error(error); showToast('保存に失敗しました。'); return false; }

function buildData(){

    const base = SEED[id], ov = overrides[id] || {};
    if(ov.deleted) return;
    data[id] = {
      type: base.type, name: ov.name || base.name, coords: ov.coords || base.coords || null,
      desc: ov.desc || base.desc, image: ov.image || base.image || null,
      photos: [...((base.photos || (base.photoOld||base.photoNow ? [base.photoOld,base.photoNow].filter(Boolean) : [])) || []), ...(ov.extraPhotos||[])],
      canon: ov.canon !== undefined ? ov.canon : base.canon,
      relevance: ov.relevance || base.relevance || 'core',
      related: Array.from(new Set([...(base.related||[]), ...(ov.extraRelated||[])]))
    };
  });
  Object.keys(additions).forEach(id=>{
    const a = additions[id], ov = overrides[id] || {};
    data[id] = {
      type: a.type, name: ov.name || a.name, coords: ov.coords || a.coords || null,

      canon: ov.canon !== undefined ? ov.canon : (a.canon !== undefined ? a.canon : true),
      relevance: ov.relevance || a.relevance || 'core',
      related: Array.from(new Set([...(a.related||[]), ...(ov.extraRelated||[])]))
    };
  });

}

function findLinkCandidates(token){
  if(DATA[token]) return [token]; // 明示的なID指定（曖昧さ解消済み）
  const exactMatches = Object.keys(DATA).filter(id=>DATA[id].name === token);
  if(exactMatches.length) return exactMatches;
  return Object.keys(DATA).filter(id=>fuzzyMatch(DATA[id].name, token));
}
function parseDescSegments(desc){
  const regex = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
  const segments = [];
  let lastIndex = 0, m;
  while((m = regex.exec(desc)) !== null){
    if(m.index > lastIndex) segments.push({type:'text', content: desc.slice(lastIndex, m.index)});
    const token = m[1].trim();
    const candidates = findLinkCandidates(token);
    const display = m[2] ? m[2].trim() : (candidates.length===1 ? DATA[candidates[0]].name : token);
    if(candidates.length === 1) segments.push({type:'link', id: candidates[0], display});
    else if(candidates.length > 1) segments.push({type:'ambiguous', token, display, candidates});
    else segments.push({type:'text', content: display});
    lastIndex = regex.lastIndex;
  }
  if(lastIndex < desc.length) segments.push({type:'text', content: desc.slice(lastIndex)});
  return segments;
}
let ambiguousLinkRegistry = [];
function segmentsToHtml(segments){
  return segments.map(seg=>{
    if(seg.type==='link') return `<button class="desc-link" data-id="${seg.id}">${escapeHtml(seg.display)}</button>`;
    if(seg.type==='ambiguous'){
      const idx = ambiguousLinkRegistry.length;
      ambiguousLinkRegistry.push(seg);
      return `<button class="desc-link-ambiguous" data-amb-idx="${idx}" title="候補が複数あります。クリックして選んでください">${escapeHtml(seg.display)}</button>`;
    }
    return escapeHtml(seg.content);
  }).join('');
}

function haversineKm(a,b){
  const toRad = d=>d*Math.PI/180, R=6371;
  const dLat=toRad(b[0]-a[0]), dLon=toRad(b[1]-a[1]);
  const lat1=toRad(a[0]), lat2=toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function zoomForCoords(coords, excludeId){
  let minDist = Infinity;
  Object.keys(DATA).forEach(oid=>{
    if(oid===excludeId) return;
    const o = DATA[oid];
    if(o.type!=='place' || !o.coords) return;
    const d = haversineKm(coords, o.coords);
    if(d<minDist) minDist=d;
  });
  if(minDist<=2) return 16;
  if(minDist<=5) return 14;
  if(minDist<=20) return 13;
  return 12;
}
function zoomForEntity(id){
  const e = DATA[id];
  if(!e || !e.coords) return 12;
  return zoomForCoords(e.coords, id);
}

function compressImageToBlob(file, maxDim=800, quality=0.72){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/')){ reject(new Error('not image')); return; }
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('read failed'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('decode failed'));
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        canvas.toBlob(blob=>{
          if(blob) resolve(blob); else reject(new Error('blob failed'));
        }, 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
const STORAGE_BUCKET = 'atlas-photos';
async function uploadImageToStorage(file){
  const blob = await compressImageToBlob(file);
  const path = `uploads/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  const { error } = await supabaseClient.storage.from(STORAGE_BUCKET).upload(path, blob, {contentType:'image/jpeg', upsert:false});
  if(error) throw error;
  const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function geocodeSearchOnce(query, lang){
  try{
    if(MAPTILER_KEY.includes('YOUR_MAPTILER')) throw new Error('no key');
    const langParam = lang ? `&language=${lang}` : '';
    const url = `https://api.maptiler.com/geocoding/${encodeURIComponent(query)}.json?key=${MAPTILER_KEY}${langParam}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('geocode failed');
    const data = await res.json();
    return (data.features||[]).map(f=>{
      const center = f.center || (f.geometry && f.geometry.coordinates) || [null,null];
      const lon = center[0], lat = center[1];
      return {lat, lon, display_name: f.place_name || f.text || query, placeType: f.place_type || []};
    }).filter(r=>r.lat!==null);
  }catch(e){ return null; }
}
async function nominatimSearchFallback(query){

    const res = await fetch(url);

}
// カタカナ表記が地名データベースに登録されていないケース向けの、独自の対応辞書。
// 「カタカナ検索で見つからなかった地名」を見つけるたびにここへ追加していく。
const KATAKANA_PLACE_ALIASES = {
  "オックスフォードストリート": "Oxford Street, London",
  "ウーリッジ": "Woolwich, London",
};
function normalizeForAlias(s){
  return s.replace(/[・･\s]/g,'');
}
function resolveKatakanaAlias(query){
  const key = normalizeForAlias(query);
  const merged = Object.assign({}, KATAKANA_PLACE_ALIASES, customAliases);
  if(merged[key]) return merged[key];
  // 前方一致（例：「オックスフォードスト」→「オックスフォードストリート」）
  let best = null, bestLen = -1;
  Object.keys(merged).forEach(k=>{
    if((k.startsWith(key) || key.startsWith(k)) && k.length > bestLen){
      best = merged[k]; bestLen = k.length;
    }
  });
  if(best) return best;
  // あいまい一致（多少の文字違いを許容）
  for(const k of Object.keys(merged)){
    if(fuzzyMatch(k, query)) return merged[k];
  }
  return null;
}
async function saveCustomAlias(query, englishName){
  const key = normalizeForAlias(query);
  customAliases[key] = englishName;
  await safeSet('p-aliases', customAliases);
}
async function deleteCustomAlias(key){
  delete customAliases[key];
  await safeSet('p-aliases', customAliases);
}
async function geocodeSearch(query){
  const alias = resolveKatakanaAlias(query);
  if(alias){
    const aliasResults = await geocodeSearchOnce(alias, null);
    if(aliasResults && aliasResults.length > 0) return aliasResults;
  }
  const jaResults = await geocodeSearchOnce(query, 'ja');
  if(jaResults && jaResults.length > 0) return jaResults;
  // 日本語優先で見つからなければ、言語指定なし（英語表記優先）で再検索
  const fallback = await geocodeSearchOnce(query, null);
  if(fallback && fallback.length > 0) return fallback;
  // それでも見つからなければ、OpenStreetMap本家の検索エンジンも試す
  const nominatim = await nominatimSearchFallback(query);
  if(nominatim && nominatim.length > 0) return nominatim;
  // 全部が通信失敗なら null、どれかが「0件」なら空配列を返す
  if(jaResults === null && fallback === null && nominatim === null) return null;
  return [];
}

function labelDirectionFor(id){
  const dirs = [
    {direction:'right', offset:[10,0]},
    {direction:'left', offset:[-10,0]},
    {direction:'top', offset:[0,-12]},
    {direction:'bottom', offset:[0,12]}
  ];
  let hash = 0;
  for(let i=0;i<id.length;i++){ hash = (hash*31 + id.charCodeAt(i)) >>> 0; }
  return dirs[hash % dirs.length];
}
function renderMarkers(){
  markerClusterGroup.clearLayers();
  Object.values(markers).forEach(m=>{ if(map.hasLayer(m)) map.removeLayer(m); });

    const e = DATA[id];
    if(e.type==='place' && e.coords){
      if(coreOnlyFilter && e.relevance==='peripheral') return;
      const isSpecial = id === 'baker-street';
      const icon = isSpecial ? makeSpecialIcon() : (e.relevance==='peripheral' ? makePeripheralIcon() : makeIcon());

      } else if(isInUK(e.coords)){
        const ld = labelDirectionFor(id);
        m.bindTooltip(e.name,{direction:ld.direction,offset:ld.offset,permanent:true,className: e.relevance==='peripheral' ? 'place-label place-label-peripheral' : 'place-label'});
        m.on('mouseover', ()=>{ m.getTooltip()?.getElement()?.classList.add('force-show'); });
        m.on('mouseout', ()=>{ m.getTooltip()?.getElement()?.classList.remove('force-show'); });
      }
      else m.bindTooltip(e.name,{direction:'top',offset:[0,-10]});
      markers[id]=m;
      if(isSpecial) m.addTo(map);
      else markerClusterGroup.addLayer(m);
    }
  });
}

function showEntity(id, opts={}){
  const e = DATA[id];
  if(!e) return;
  document.getElementById('timeline').classList.remove('open');
  document.getElementById('myBook').classList.remove('open');
  if(!opts.fromTrail){ trail = trail.filter(t=>t!==id); trail.push(id); if(trail.length>6) trail.shift(); }
  document.querySelectorAll('.index-item').forEach(b=>b.classList.toggle('active', b.dataset.id===id));
  if(e.type==='place' && e.coords){
    try{
      const m0 = markers[id];
      const zoom = zoomForEntity(id);
      if(m0 && markerClusterGroup.hasLayer(m0) && !m0._icon){
        // まだクラスタの中に隠れている場合だけ、展開してから微調整
        markerClusterGroup.zoomToShowLayer(m0, ()=>{
          const finalZoom = map.getZoom();
          flyToAvoidingPanel(e.coords, finalZoom);
          lastShownPlace = {coords: e.coords, zoom: finalZoom};
        });
      } else {
        // 既に個別ピンとして見えている場合は、そのまま素直に移動
        flyToAvoidingPanel(e.coords, zoom);
        lastShownPlace = {coords: e.coords, zoom};
      }

      console.error('map centering failed:', err);
      lastShownPlace = {coords: e.coords, zoom: zoomForEntity(id)};

    : '';
  const noteHtml = renderNoteSection(id);

  const favBtnHtml = `<button class="fav-toggle-btn ${isFav?'active':''}" id="favToggleBtn">${isFav?'★':'☆'} お気に入り</button>`;

function flyToAvoidingPanel(latlng, zoom){
  const panelWidth = panel.offsetWidth;
  const targetPoint = map.project(latlng, zoom);
  const shiftedPoint = targetPoint.add(L.point(panelWidth/2, 0));
  const shiftedLatLng = map.unproject(shiftedPoint, zoom);
  map.flyTo(shiftedLatLng, zoom, {duration:0.7});
}
function goToMap(id){
  const e = DATA[id];
  if(!e || !e.coords) return;
  panel.classList.remove('open');
  document.getElementById('timeline').classList.remove('open');
  document.getElementById('myBook').classList.remove('open');
  const m = markers[id];
  if(m && markerClusterGroup.hasLayer(m)){
    markerClusterGroup.zoomToShowLayer(m, ()=>{ m.openTooltip(); });
  } else if(m){
    map.flyTo(e.coords, zoomForEntity(id), {duration:0.7});
    m.openTooltip();
  } else {
    map.flyTo(e.coords, zoomForEntity(id), {duration:0.7});
  }
}

function wireNoteSection(id){

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvEscape(v){
  if(v===null || v===undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportAsJSON(){
  const out = {};
  Object.keys(DATA).forEach(id=>{ out[id] = {id, ...DATA[id]}; });
  downloadFile('holmes-atlas-data.json', JSON.stringify(out, null, 2), 'application/json');
}
function exportAsCSV(){
  const headers = ['id','type','name','desc','lat','lng','canon_or_pastiche','relevance','related'];
  const rows = [headers.join(',')];
  Object.keys(DATA).forEach(id=>{
    const e = DATA[id];
    const row = [
      id, e.type, e.name, e.desc,
      e.coords ? e.coords[0] : '', e.coords ? e.coords[1] : '',
      e.type==='work' ? (e.canon ? '正典' : '正典外') : '',
      e.type==='place' ? (e.relevance || 'core') : '',
      (e.related||[]).join(';')
    ].map(csvEscape);
    rows.push(row.join(','));
  });
  downloadFile('holmes-atlas-data.csv', '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8;');
}

  let detailHtml = '';

      ${p.draft.desc ? `<div><strong>説明を変更：</strong>${escapeHtml(p.draft.desc)}</div>` : ''}

    ${detailHtml}
    <div class="proposal-actions">
      <button class="modal-submit" id="approve-${p.id}">承認する</button>
      <button class="danger-delete-btn" id="reject-${p.id}">却下する</button>
    </div>
  </div>`;

async function approveProposal(propId){
  const p = proposals.find(x=>x.id===propId);
  if(!p) return;
  if(p.kind==='new'){
    const newId = 'u-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    additions[newId] = p.draft;
    await safeSet('p-additions', additions);
    (p.draft.related||[]).forEach(relId=>{
      overrides[relId] = overrides[relId] || {};
      const extra = new Set(overrides[relId].extraRelated||[]);
      extra.add(newId);
      overrides[relId].extraRelated = Array.from(extra);
    });
    await safeSet('p-overrides', overrides);
  } else if(p.kind==='photo'){
    overrides[p.targetId] = overrides[p.targetId] || {};
    overrides[p.targetId].extraPhotos = overrides[p.targetId].extraPhotos || [];
    overrides[p.targetId].extraPhotos.push(p.draft);
    await safeSet('p-overrides', overrides);
  } else {
    overrides[p.targetId] = Object.assign(overrides[p.targetId] || {}, p.draft);
    await safeSet('p-overrides', overrides);
  }
  p.status = 'approved';
  await safeSet('p-proposals', proposals);
  DATA = buildData(); renderMarkers(); renderIndex();
  showToast('承認しました。');
  updateReviewCountBadge();
  openReviewDashboard();
}
async function rejectProposal(propId){
  const p = proposals.find(x=>x.id===propId);
  if(!p) return;
  p.status = 'rejected';
  await safeSet('p-proposals', proposals);
  showToast('却下しました。');
  updateReviewCountBadge();
  openReviewDashboard();
}

  }
  const reportBtn = ev.target.closest('[data-report-journal]');
  if(reportBtn){ openReportModal(reportBtn.dataset.reportJournal); return; }
});

function openJournalDetail(id){
  const j = journal.find(x=>x.id===id);
  if(!j) return;
  modalBody.innerHTML = `
    <h3>${escapeHtml(j.placeName)}</h3>
    <div class="modal-sub">${j.visitedDate?('訪問日: '+escapeHtml(j.visitedDate)):''}</div>
    ${renderJournalCard(j)}
    <div class="modal-actions"><button class="modal-cancel" id="jd-close">閉じる</button></div>`;
  overlay.classList.add('open');
  document.getElementById('jd-close').addEventListener('click', closeModal);
}

// ---------- タイムライン ----------
const timelineEl = document.getElementById('timeline');
document.getElementById('timelineToggle').addEventListener('click', ()=>{
  panel.classList.remove('open');
  myBookEl.classList.remove('open');
  timelineEl.classList.toggle('open');
  if(timelineEl.classList.contains('open')) renderTimeline();
});
function renderTimeline(){
  const items = journal.slice().sort((a,b)=>b.createdAt-a.createdAt);
  const html = items.length ? items.map(j=>{
    const label = j.entityId ? (DATA[j.entityId]?.name || j.placeName) : j.placeName + '　<span class="empty-msg">（アトラス未登録）</span>';
    return `<div class="journal-card" data-tl-entity="${j.entityId||''}" data-tl-lat="${j.coords?j.coords[0]:''}" data-tl-lng="${j.coords?j.coords[1]:''}" style="cursor:pointer;">
      <div class="jc-place">${label}</div>
      ${renderJournalCard(j)}
    </div>`;
  }).join('') : '<p class="empty-msg">まだ訪問記録がありません。</p>';
  timelineEl.innerHTML = `<button class="timeline-close" id="timelineClose">×</button><h2>訪問記録タイムライン</h2><div class="timeline-note">${items.length}件を新しい順に表示しています。</div><div>${html}</div>`;
  document.getElementById('timelineClose').addEventListener('click', ()=>timelineEl.classList.remove('open'));
  timelineEl.querySelectorAll('[data-tl-entity]').forEach(card=>{
    card.addEventListener('click', (ev)=>{
      if(ev.target.closest('[data-del-journal]')) return;
      const eid = card.dataset.tlEntity;
      timelineEl.classList.remove('open');
      if(eid) showEntity(eid);
      else if(card.dataset.tlLat){
        const c=[parseFloat(card.dataset.tlLat), parseFloat(card.dataset.tlLng)];
        map.flyTo(c, zoomForCoords(c,null), {duration:0.7});
      }
    });
  });
}

// ---------- マイ巡礼手帳 ----------
const myBookEl = document.getElementById('myBook');
const BADGE_TIERS = [
  {min:50, icon:'🕵️', label:'名探偵の相棒'},
  {min:30, icon:'🏠', label:'ベイカー街の常連'},
  {min:15, icon:'📖', label:'熱心な会員'},
  {min:5,  icon:'🔍', label:'駆け出し捜査官'},
  {min:1,  icon:'👣', label:'第一歩'},
  {min:0,  icon:'🎩', label:'見習い'}
]; // min件数の降順。全地点踏破は別枠で判定する。
function badgeForCount(visited, total){
  if(total>0 && visited>=total) return {icon:'🏆', label:'全地点踏破'};
  return BADGE_TIERS.find(t=>visited>=t.min) || BADGE_TIERS[BADGE_TIERS.length-1];
}
function renderMyBook(){
  if(!currentUser){
    myBookEl.innerHTML = `<button class="timeline-close" id="myBookClose">×</button><h2>マイ巡礼手帳</h2><p class="empty-msg">ログインすると、自分の訪問記録と踏破状況がここにまとまります。</p>`;
    document.getElementById('myBookClose').addEventListener('click', ()=>myBookEl.classList.remove('open'));
    return;
  }
  const myPosts = journal.filter(j=>j.authorId===currentUser.id).sort((a,b)=>b.createdAt-a.createdAt);
  const visitedIds = new Set(myPosts.filter(j=>j.entityId).map(j=>j.entityId));
  const visitedCount = visitedIds.size;
  const totalPlaces = Object.values(DATA).filter(e=>e.type==='place').length;
  const pct = totalPlaces>0 ? Math.min(100, Math.round(visitedCount/totalPlaces*100)) : 0;
  const likeTotal = myPosts.reduce((s,j)=>s+((j.likedBy||[]).length), 0);
  const badge = badgeForCount(visitedCount, totalPlaces);
  const isComplete = totalPlaces>0 && visitedCount>=totalPlaces;
  const nextTier = isComplete ? null : BADGE_TIERS.slice().reverse().find(t=>t.min>visitedCount);
  const nextHtml = isComplete
    ? `<div class="mybook-badge-next">全${totalPlaces}地名を踏破しました！</div>`
    : (nextTier ? `<div class="mybook-badge-next">あと${nextTier.min-visitedCount}件の地名を訪れると「${nextTier.label}」</div>` : '');
  const statsHtml = `
    <div class="mybook-stats">
      <div class="mybook-badge-row"><span class="mybook-badge-icon">${badge.icon}</span><div><div class="mybook-badge-label">${badge.label}</div>${nextHtml}</div></div>
      <div class="mybook-progress-bar"><div class="mybook-progress-fill" style="width:${pct}%"></div></div>
      <div class="mybook-numbers">
        <div><strong>${visitedCount}</strong>／${totalPlaces} 訪問済み地名</div>
        <div><strong>${myPosts.length}</strong> 投稿数</div>
        <div><strong>${likeTotal}</strong> いいねを獲得</div>
      </div>
    </div>`;
  const listHtml = myPosts.length ? myPosts.map(j=>{
    const label = j.entityId ? (DATA[j.entityId]?.name || j.placeName) : j.placeName + '　<span class="empty-msg">（アトラス未登録）</span>';
    return `<div class="journal-card" data-tl-entity="${j.entityId||''}" data-tl-lat="${j.coords?j.coords[0]:''}" data-tl-lng="${j.coords?j.coords[1]:''}" style="cursor:pointer;">
      <div class="jc-place">${label}</div>
      ${renderJournalCard(j)}
    </div>`;
  }).join('') : '<p class="empty-msg">まだ訪問記録がありません。「＋ 訪問記録を追加」から書いてみましょう。</p>';
  myBookEl.innerHTML = `<button class="timeline-close" id="myBookClose">×</button><h2>マイ巡礼手帳</h2><div class="mybook-section-label">${escapeHtml(getDisplayName(currentUser))}さんの記録</div>${statsHtml}<div>${listHtml}</div>`;
  document.getElementById('myBookClose').addEventListener('click', ()=>myBookEl.classList.remove('open'));
  myBookEl.querySelectorAll('[data-tl-entity]').forEach(card=>{
    card.addEventListener('click', (ev)=>{
      if(ev.target.closest('[data-del-journal],[data-like-journal],[data-reply-toggle],[data-reply-submit],[data-report-journal],.jc-reply-form')) return;
      const eid = card.dataset.tlEntity;
      myBookEl.classList.remove('open');
      if(eid) showEntity(eid);
      else if(card.dataset.tlLat){
        const c=[parseFloat(card.dataset.tlLat), parseFloat(card.dataset.tlLng)];
        map.flyTo(c, zoomForCoords(c,null), {duration:0.7});
      }
    });
  });
}

// ---------- 地図検索 ----------
const mapSearchInput = document.getElementById('mapSearchInput');
const mapSearchResults = document.getElementById('mapSearchResults');
let externalMarker = null;
function normalizeSearchStr(s){
  return s.toLowerCase().replace(/[・･\s\-—–_,、。]/g,'');
}
function fuzzyMatch(target, query){
  const t = normalizeSearchStr(target), q = normalizeSearchStr(query);
  if(!q) return false;
  if(t.includes(q)) return true;
  if(q.length < 2) return false;
  let ti=0, matched=0;
  for(const ch of q){
    const idx = t.indexOf(ch, ti);
    if(idx>=0){ matched++; ti = idx+1; }
  }
  return (matched / q.length) >= 0.7;
}
function localMatches(q){
  return Object.keys(DATA).filter(id=>fuzzyMatch(DATA[id].name, q)).slice(0,6);
}
function renderSearchResults(localIds, externalResults, query){
  let html='';
  if(localIds.length){
    html += `<div class="map-search-section">アトラス内の項目</div>`;
    html += localIds.map(id=>`<button type="button" class="map-search-item" data-local="${id}"><span class="dot dot-${entityClass(DATA[id])}"></span>${escapeHtml(DATA[id].name)}<span class="msi-sub">${entityLabel(DATA[id])}</span></button>`).join('');
  }
  if(externalResults!==null){
    html += `<div class="map-search-section">地図上の候補地</div>`;
    if(externalResults === undefined){
      html += `<div class="map-search-section" style="background:none;">検索に失敗しました。通信環境をご確認のうえ、もう一度お試しください。</div>`;
    } else {
      if(externalResults.length){
        html += externalResults.map((r,i)=>`<button type="button" class="map-search-item" data-ext="${i}">${escapeHtml(r.display_name)}</button>`).join('');
      } else {
        html += `<div class="map-search-section" style="background:none;">見つかりませんでした</div>`;
      }
      const prefill = externalResults.length ? externalResults[0].display_name : '';
      html += `<div class="alias-register-row">
          <input type="text" id="aliasEnglishInput" value="${escapeAttr(prefill)}" placeholder="英語表記が分かれば登録（例：Oxford Street, London）">
          <button type="button" id="aliasRegisterBtn">辞書に登録</button>
        </div>`;
    }
  }
  if(!html) return;
  mapSearchResults.innerHTML = html;
  mapSearchResults.classList.add('show');
  mapSearchResults.querySelectorAll('[data-local]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ saveRecentSearch(DATA[btn.dataset.local].name); showEntity(btn.dataset.local); mapSearchResults.classList.remove('show'); mapSearchInput.value=''; });
  });
  if(externalResults){
    mapSearchResults.querySelectorAll('[data-ext]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ saveRecentSearch(externalResults[parseInt(btn.dataset.ext)].display_name); selectExternalLocation(externalResults[parseInt(btn.dataset.ext)]); mapSearchResults.classList.remove('show'); });
    });
  }
  const aliasBtn = document.getElementById('aliasRegisterBtn');
  if(aliasBtn){
    aliasBtn.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      if(!currentUser){ showToast('辞書の登録にはログインが必要です。'); return; }
      const englishName = document.getElementById('aliasEnglishInput').value.trim();
      if(!englishName){ showToast('英語表記を入力してください。'); return; }
      await saveCustomAlias(query, englishName);
      showToast(`「${query}」→「${englishName}」を辞書に登録しました。`);
      const results = await geocodeSearch(query);
      renderSearchResults(localMatches(query), results===null ? undefined : results, query);
    });
  }
}
function zoomForSearchResult(r){
  const types = r.placeType || [];
  if(types.includes('country')) return 5;
  if(types.includes('region') || types.includes('subregion') || types.includes('county')) return 7;
  if(types.includes('place')) return 10;
  if(types.includes('postal_code') || types.includes('locality') || types.includes('neighborhood') || types.includes('district') || types.includes('municipal_district')) return 13;
  if(types.includes('address') || types.includes('street') || types.includes('poi') || types.includes('poi.landmark')) return 16;
  // place_typeが取れない場合は、表記の細かさ（カンマ区切りの数）から推定
  const parts = (r.display_name||'').split(/,|、/).map(s=>s.trim()).filter(Boolean);
  if(parts.length <= 1) return 6;
  if(parts.length === 2) return 9;
  return 15;
}
function selectExternalLocation(r){
  const lat=parseFloat(r.lat), lng=parseFloat(r.lon);
  panel.classList.remove('open'); timelineEl.classList.remove('open');
  map.flyTo([lat,lng], zoomForSearchResult(r), {duration:0.8});
  if(externalMarker) map.removeLayer(externalMarker);
  externalMarker = L.marker([lat,lng], {icon: L.divIcon({className:'leaflet-holmes-icon', iconSize:[26,26], iconAnchor:[13,26],
    html:'<svg viewBox="0 0 24 24" fill="none" stroke="#ece3cc" stroke-width="2.2"><circle cx="12" cy="9" r="3"/><path d="M12 21c-4-4-7-7.5-7-11a7 7 0 0 1 14 0c0 3.5-3 7-7 11z"/></svg>'})}).addTo(map);
  const shortName = r.display_name.split(/、|,/)[0];
  const popupEl = document.createElement('div');
  popupEl.innerHTML = `<div style="font-family:'Crimson Pro',serif;font-size:.85rem;max-width:220px;">
    <div style="margin-bottom:6px;">${escapeHtml(r.display_name)}</div>
    <button type="button" class="search-popup-btn" id="addFromSearchBtn">新しい地名として追加</button>
    <button type="button" class="search-popup-btn" id="journalFromSearchBtn" style="background:var(--teal);margin-top:6px;">訪問記録だけ残す</button>
  </div>`;
  externalMarker.bindPopup(popupEl);
  externalMarker.once('popupopen', ()=>{
    document.getElementById('addFromSearchBtn').addEventListener('click', ()=>{
      if(!currentUser){ showToast('新しい項目の追加にはログインが必要です。'); return; }
      openEntityModal({name:shortName, lat, lng});
    });
    document.getElementById('journalFromSearchBtn').addEventListener('click', ()=>{
      if(!currentUser){ showToast('訪問記録の投稿にはログインが必要です。'); return; }
      openJournalModal({name:shortName, lat, lng});
    });
  });
  externalMarker.openPopup();
}
let searchDebounce;
const mapSearchClearBtn = document.getElementById('mapSearchClearBtn');
const RECENT_SEARCH_KEY = 'holmes-atlas-recent-searches';
function getRecentSearches(){
  try{ return JSON.parse(localStorage.getItem(RECENT_SEARCH_KEY) || '[]'); }catch(e){ return []; }
}
function saveRecentSearch(q){
  if(!q || !q.trim()) return;
  q = q.trim();
  let list = getRecentSearches().filter(x=>x!==q);
  list.unshift(q);
  list = list.slice(0,8);
  try{ localStorage.setItem(RECENT_SEARCH_KEY, JSON.stringify(list)); }catch(e){}
}
function renderRecentSearches(){
  const list = getRecentSearches();
  if(list.length===0){ mapSearchResults.classList.remove('show'); return; }
  let html = `<div class="map-search-section">最近の検索</div>`;
  html += list.map(q=>`<button type="button" class="map-search-item recent-search-item" data-recent="${escapeAttr(q)}">🕐 ${escapeHtml(q)}</button>`).join('');
  mapSearchResults.innerHTML = html;
  mapSearchResults.classList.add('show');
  mapSearchResults.querySelectorAll('[data-recent]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      mapSearchInput.value = btn.dataset.recent;
      mapSearchInput.dispatchEvent(new Event('input'));
    });
  });
}
mapSearchInput.addEventListener('focus', ()=>{
  if(!mapSearchInput.value.trim()) renderRecentSearches();
});
mapSearchInput.addEventListener('input', ()=>{
  clearTimeout(searchDebounce);
  const q = mapSearchInput.value.trim();
  mapSearchClearBtn.style.display = q ? 'block' : 'none';
  if(!q){ mapSearchResults.classList.remove('show'); return; }
  renderSearchResults(localMatches(q), null, q);
  searchDebounce = setTimeout(async ()=>{
    const results = await geocodeSearch(q);
    renderSearchResults(localMatches(q), results===null ? undefined : results, q);
  }, 500);
});
mapSearchClearBtn.addEventListener('click', ()=>{
  mapSearchInput.value = '';
  mapSearchClearBtn.style.display = 'none';
  mapSearchResults.classList.remove('show');
  mapSearchInput.focus();
});
document.getElementById('mapSearchBtn').addEventListener('click', async ()=>{
  const q = mapSearchInput.value.trim();
  if(!q) return;
  const results = await geocodeSearch(q);
  renderSearchResults(localMatches(q), results===null ? undefined : results, q);
});
document.addEventListener('click', (ev)=>{ if(!ev.target.closest('.map-search')) mapSearchResults.classList.remove('show'); });

// ---------- 現在地から近い場所 ----------
const locateMapBtn = document.getElementById('locateMapBtn');
const nearbyPanel = document.getElementById('nearbyPanel');
let userLocationMarker = null;
function formatDist(km){ return km<1 ? Math.round(km*1000)+'m' : km.toFixed(1)+'km'; }
locateMapBtn.addEventListener('click', ()=>{
  if(!navigator.geolocation){ showToast('お使いのブラウザは位置情報に対応していません。'); return; }
  showToast('現在地を取得しています…');
  navigator.geolocation.getCurrentPosition(onLocationSuccess, onLocationError, {enableHighAccuracy:false, timeout:10000, maximumAge:60000});
});
function onLocationSuccess(pos){
  const userCoords = [pos.coords.latitude, pos.coords.longitude];
  panel.classList.remove('open'); timelineEl.classList.remove('open');
  if(userLocationMarker) map.removeLayer(userLocationMarker);
  userLocationMarker = L.circleMarker(userCoords, {radius:8, color:'#2f5d5a', fillColor:'#2f5d5a', fillOpacity:.85, weight:2}).addTo(map);
  userLocationMarker.bindTooltip('現在地', {direction:'top', offset:[0,-8]});
  const nearby = Object.keys(DATA).filter(id=>DATA[id].type==='place' && DATA[id].coords)
    .map(id=>({id, dist: haversineKm(userCoords, DATA[id].coords)})).sort((a,b)=>a.dist-b.dist).slice(0,8);
  if(nearby.length===0 || nearby[0].dist>300){
    map.flyTo(userCoords, 12, {duration:0.8});
    showToast('現在地の近くに登録済みの場所は見つかりませんでした。');
    nearbyPanel.classList.remove('show');
    return;
  }
  nearbyPanel.innerHTML = `<div class="nearby-panel-head">現在地から近い場所<button class="nearby-panel-close" id="nearbyPanelClose">×</button></div>
    ${nearby.map(n=>`<button type="button" class="nearby-item" data-id="${n.id}"><span>${escapeHtml(DATA[n.id].name)}</span><span class="ni-dist">${formatDist(n.dist)}</span></button>`).join('')}`;
  nearbyPanel.classList.add('show');
  nearbyPanel.querySelectorAll('[data-id]').forEach(btn=>btn.addEventListener('click', ()=>{ nearbyPanel.classList.remove('show'); showEntity(btn.dataset.id); }));
  document.getElementById('nearbyPanelClose').addEventListener('click', ()=>nearbyPanel.classList.remove('show'));
  map.flyTo(userCoords, 11, {duration:0.8});
}
function onLocationError(err){
  let msg = '現在地を取得できませんでした。';
  if(err.code===err.PERMISSION_DENIED) msg='位置情報の利用が許可されませんでした。';
  else if(err.code===err.POSITION_UNAVAILABLE) msg='現在地を特定できませんでした。';
  else if(err.code===err.TIMEOUT) msg='タイムアウトしました。';
  if(location.protocol==='file:') msg += '（file://で開いている場合、使えないことがあります）';
  showToast(msg);
}
document.addEventListener('click', (ev)=>{ if(!ev.target.closest('.nearby-panel') && !ev.target.closest('.locate-map-btn')) nearbyPanel.classList.remove('show'); });
